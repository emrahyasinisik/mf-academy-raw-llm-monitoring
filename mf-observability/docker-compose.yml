# Prometheus + Grafana, in their own containers, scraping the Go backend.
#
# Two containers with one job each, talking over the compose network:
#
#   prometheus  scrapes the backend's /metrics on a schedule and stores it
#   grafana     queries prometheus and draws it
#
# Grafana never touches the backend. That is not an implementation detail — a
# common misreading of this architecture has the application pushing to Grafana,
# and it does not work that way: Prometheus pulls, Grafana only asks Prometheus.
#
#   backend  <--scrape--  prometheus  <--query--  grafana
#
# Only Grafana publishes a port. Prometheus is reachable from Grafana over the
# compose network and from nowhere else.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The bearer token, as a file — Prometheus does not expand environment
      # variables in its config. Create it from .env.example's instructions; it
      # is gitignored.
      - ./prometheus/metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days is far more than this project needs and keeps the volume small.
      - --storage.tsdb.retention.time=15d
    extra_hosts:
      # Lets the local-backend scrape target resolve on Linux, where
      # host.docker.internal is not defined by default.
      - "host.docker.internal:host-gateway"

  # Log storage. Metrics say a replica is slow; logs say why — and with the
  # inference service scaled out, "which replica" is a question only the logs
  # can answer.
  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  # Reads container logs off the Docker socket and ships them to Loki.
  #
  # Alloy rather than Promtail: Promtail reached end of life on 2 March 2026.
  alloy:
    image: grafana/alloy:v1.7.1
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only, and this is the whole reason Alloy can see containers from
      # the other compose project. A writable socket would be handing this
      # container control of the Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    ports:
      # Still localhost-only. The tunnel reaches Grafana over the `edge` network
      # below, not through this binding, so publishing nothing more is correct.
      - "127.0.0.1:3001:3000"
    networks:
      # `default` keeps Prometheus and Loki reachable; `edge` is what lets
      # cloudflared, which runs in the mf-inference project, resolve `grafana`.
      - default
      - edge
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      # Both stay off even once a public hostname exists. Access authenticates
      # who reaches Grafana; these decide what an unauthenticated request would
      # be allowed to do if it ever arrived, and the answer must remain
      # "nothing" — a misconfigured policy should fail closed, not publish the
      # dashboards.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana builds redirects and share links from this. Left at the
      # localhost default it would send a tunnel visitor to their own machine
      # after login.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

networks:
  # Declared external so this project does not own it: `docker compose down`
  # here must not tear a network out from under the tunnel in the other project.
  # Create it once, on the box:
  #
  #   docker network create mf-edge
  #
  # Only Grafana joins it. Prometheus and Loki stay on the default network with
  # no published ports, so the seam that makes Grafana reachable does not make a
  # metrics store or a log store reachable with it.
  edge:
    external: true
    name: mf-edge
