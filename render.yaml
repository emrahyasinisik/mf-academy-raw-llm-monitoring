# Render Blueprint — provisions the Go web service + a managed Postgres.
# Deploy via the Render MCP or the dashboard ("New +" → "Blueprint").

databases:
  - name: mf-monitoring-db
    databaseName: mf_monitoring
    user: mf
    plan: free

services:
  - type: web
    name: mf-backend
    runtime: go
    plan: free
    # Monorepo: this service lives in the mf-backend/ subdirectory.
    rootDir: mf-backend
    buildCommand: go build -o app ./cmd/server
    startCommand: ./app
    healthCheckPath: /health
    # Both sides now speak the new /llm/runs contract, so the ordering that
    # forced a manual release is no longer a constraint.
    #
    # Note for the next breaking change: the frontend deploys from this same
    # push via Vercel, and the two build at different speeds, so a contract
    # change leaves a window where they disagree. Work out which side must land
    # first from the fields each reads on the other's response — not from which
    # service owns the change — then set this to false while you release them in
    # that order.
    autoDeploy: true
    envVars:
      # Wired automatically from the managed database above.
      - key: DATABASE_URL
        fromDatabase:
          name: mf-monitoring-db
          property: connectionString
      # A strong secret generated by Render (never commit real secrets).
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      # Render terminates TLS and fronts this service with its own proxy, so
      # X-Forwarded-For is set by infrastructure we control and RealIP may
      # trust it. Without this the limiter sees only the proxy's address and
      # buckets every user together — one abuser would then lock everyone out.
      - key: TRUST_PROXY
        value: "true"
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 168h
      # Vercel frontend origins, comma separated, no trailing slash.
      #
      # Two of them on purpose, and the order of operations matters more than
      # the value: attaching a new domain in Vercel serves it immediately, but
      # every API call from it fails CORS until this list allows it. So the
      # backend lands first and carries both, the domain is attached second,
      # and the old origin is dropped only after the new one is verified.
      # Reversed, the new address opens to a screen where nothing works.
      #
      # Tokens live in localStorage, not cookies, so there is no cookie-domain
      # problem — but localStorage is per origin, so everyone signs in once
      # more on the new address.
      - key: CORS_ORIGINS
        value: https://mf-academy-raw-llm-monitoring-ten.vercel.app,https://masterfabricacademy.vercel.app

      # Hosted demo keeps pasted case text for 30 days, then blanks the personal
      # columns and leaves the measurement row. 0 disables the sweep entirely,
      # which is a legitimate setting on an operator's own hardware and a
      # mistake here — the server warns about it at boot.
      - key: RETENTION_DAYS
        value: "30"
      - key: RETENTION_SWEEP_INTERVAL
        value: 6h

      # ---- Server-side inference (mf-inference/) ----
      #
      # Points at the self-hosted MLC host, reached through a Cloudflare tunnel.
      # No trailing /v1: the provider appends the path itself.
      #
      # Leaving this unset is a supported state — POST /llm/generate then answers
      # 503 and the browser path is unaffected — so the API survives the
      # inference machine being switched off.
      #
      # Three things hang off this one variable, all through the same gateway
      # and the same secret: generation, the hot-swap control plane (/rt), and
      # the admin panel's metric charts (/prom). None of them needs its own
      # address or its own credential, and unsetting this degrades all three the
      # same way — they report that the host is not wired instead of failing.
      - key: LLM_BASE_URL
        value: https://mlc.visevent.com
      # The shared secret the tunnel's gateway checks. sync: false means the
      # blueprint declares the variable but never carries its value: the real
      # one is set in the dashboard and stays out of this repository.
      - key: LLM_API_KEY
        sync: false
      # Qwen3-4B on a 6 GB card needs more than 25–90s for a 2048-token screen.
      # 120s fits under the gateway's 180s proxy timeout in Caddyfile.
      - key: LLM_TIMEOUT
        value: 120s
      # The engine's input window, not an output budget — see LLM_MAX_TOKENS for
      # that. mlc_llm serves the window the card affords once the weights are
      # loaded, and rejects a longer prompt with a 400 rather than a short
      # answer. The persona trims itself to this figure; it must not exceed what
      # the host reports as its max KV cache token capacity.
      #
      # 2026-08-03: back on qwen3-4b-instruct-q4f16_1-MLC (Docker-only, by
      # design — persona-v1/Gemma2-2B is not meant to run here). This build
      # gives 1416 regardless of the max_num_sequence=1 override — see
      # mf-inference/CONTEXT_WINDOW_RUNBOOK.md — so the budget must stay under
      # that, not under persona-v1's 4096.
      #
      # 1200 still measured 1518 real tokens on a research turn (Tavily's
      # extracted page content tokenises worse than the 2.2 chars/token this
      # side assumes) — over the 1416 ceiling, and what was cancelling turns
      # in production. 900 measured safely under it against the same live
      # host; tested locally against host.docker.internal before raising this
      # here, since that's the same physical box and model. Revisit only if
      # the loaded build or the estimate's accuracy changes.
      - key: LLM_MAX_PROMPT_TOKENS
        value: 900
      # Live web research for the persona. Tavily since 2026-08-03; the keyless
      # DuckDuckGo scrape ran before that and is still the fallback.
      #
      # Tavily returns already-extracted page content where the scrape returns
      # result snippets, so the evidence the model reasons over is the page
      # rather than a search listing. That is the reason to pay for it, and it
      # holds regardless of the question below.
      #
      # What was NOT established before switching: whether DuckDuckGo was
      # actually being refused here. The scrape answers a residential address
      # (measured) and may refuse a datacentre one, and Render is a datacentre —
      # but the check was never run, so this switch is an upgrade, not a repair,
      # and nobody should later read it as evidence that the keyless path was
      # broken. The evidence for that would have been "web · çalışmadı" on the
      # research trail, or the scraper's own "neither results nor a no-results
      # notice" line in the logs.
      #
      # Both halves are required and the missing half is silent: NewSearcher
      # wants provider == tavily AND a non-empty key, and falls back to the
      # scrape rather than failing when it has only one. The boot log settles it
      # in one line — `live search configured provider=… requested=… keyed=…`.
      # keyed=false means SEARCH_API_KEY never reached the dashboard.
      - key: SEARCH_PROVIDER
        value: tavily
      # sync: false — the value lives in the Render dashboard, never in the repo.
      - key: SEARCH_API_KEY
        sync: false
