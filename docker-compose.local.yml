# Bu dosya yalnızca yerel geliştirme içindir. Go ve Node bu makineye kurulu
# olmadığından backend ve frontend'i README'lerdeki gibi native çalıştırmak yerine
# container içinde çalıştırır. Render/Vercel dağıtımlarını etkilemez.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mf
      POSTGRES_PASSWORD: mf
      POSTGRES_DB: mf_monitoring
    ports:
      - "5432:5432"
    volumes:
      - mf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mf -d mf_monitoring"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./mf-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://mf:mf@postgres:5432/mf_monitoring?sslmode=disable
      JWT_SECRET: dev-insecure-secret-change-me
      CORS_ORIGINS: http://localhost:3000
      # Kendi email'inle doldur, sonra `docker compose -f docker-compose.local.yml up -d --force-recreate backend`
      # ile yeniden başlat: o hesap admin'e yükseltilir.
      ADMIN_EMAIL: ""
      # host.docker.internal kullanılıyor çünkü bu backend de bir container —
      # "localhost" burada kendi container'ına işaret eder, host makinedeki
      # gateway'e değil. LLM_API_KEY, mf-inference/.env'deki LLM_API_KEY ile
      # aynı olmalı; buraya düz yazılmıyor, kökteki .env'den (gitignored)
      # geliyor — `LLM_API_KEY=...` satırını orada tut.
      LLM_BASE_URL: http://host.docker.internal:8080
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY must be set in the repo-root .env — copy it from mf-inference/.env}
      LLM_TIMEOUT: 90s
      # Bu ikisi de repo-root .env'den geliyor — sadece mf-backend/.env'e
      # yazmak yeterli değil, compose onu okumaz, sadece burada listelenen
      # anahtarları container'a geçirir.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
  frontend:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081
    volumes:
      - ./mf-frontend:/app
      - mf-frontend-node-modules:/app/node_modules
      - mf-frontend-next-cache:/app/.next
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"

volumes:
  mf-postgres-data:
  mf-frontend-node-modules:
  mf-frontend-next-cache:
