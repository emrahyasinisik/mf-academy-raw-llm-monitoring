# Self-hosted MLC-LLM inference stack.
#
# Runs on the GPU box (Windows 11 + WSL2 + Docker Desktop + NVIDIA Container
# Toolkit), not on Render. Three containers, each with one job:
#
#   cloudflared  public HTTPS hostname -> gateway, without opening a router port
#   gateway      rejects anything without the shared secret, then load balances
#   mlc          mlc_llm serve, OpenAI-compatible API, CUDA — scalable
#
# Only cloudflared talks to the internet. mlc publishes no host port at all —
# the sole way in is through the gateway, so the secret cannot be bypassed by
# anyone who learns the tunnel hostname.

services:
  # Scaled with `docker compose up -d --scale mlc=N`. Deliberately has no
  # container_name and publishes no host port — either would make a second
  # replica collide with the first and the scale would fail on the spot.
  #
  # Read the scaling section of the README before reaching for a large N: these
  # replicas share one 6 GB card, so N buys concurrency, not throughput.
  mlc:
    build:
      context: ./mlc
      args:
        # MLC publishes one wheel per CUDA minor version. This must match the
        # base image in mlc/Dockerfile; see the README if the build fails here.
        CUDA_TAG: ${CUDA_TAG:-cu122}
    restart: unless-stopped
    # Deliberately no `ports:` — reachable only from the compose network.
    expose:
      - "8000"
    environment:
      # HF_HOME and the MLC cache share the volume below so the ~1.5 GB of
      # weights survive a container rebuild.
      HF_HOME: /cache/huggingface
      MLC_LLM_HOME: /cache/mlc
    volumes:
      # Shared by every replica. Reading the same weights concurrently is fine,
      # but MLC writes compiled kernels here on a cold start — so bring one
      # replica up first, let it answer a request, and scale out after. Starting
      # several against an empty cache has them all compiling at once.
      - model-cache:/cache
      # Locally built models: the output of the PEFT pipeline lands here, so a
      # merged-and-quantised adapter build can be served without being published
      # to Hugging Face first.
      #
      # A bind mount rather than a named volume, deliberately. The build runs
      # outside the container (merge needs transformers, which this image does
      # not carry) and the result has to be visible to both sides; a named
      # volume would be reachable only from inside Docker, which is where the
      # build is not.
      #
      # Read-only: the server has no business writing to a build artefact, and
      # the one thing it does write on a cold start — compiled kernels — belongs
      # in the cache volume above, which is writable.
      #
      # MODELS_DIR overrides the source when models/ is a symlink/junction to
      # another drive (see .env.example): Docker's bind-mount layer cannot read
      # through a link that crosses drives, so the real path has to be given directly.
      - ${MODELS_DIR:-./models}:/models:ro
    command:
      # No console-script entry point ships in the wheel; must run as a module.
      - python3
      - -m
      - mlc_llm
      - serve
      # An HF:// id downloads and caches; a /models/... path serves a build the
      # PEFT pipeline produced. Switching between them is what "activating an
      # adapter" does at the container level — see the panel's activate button,
      # which changes the model id the backend asks for, and this variable,
      # which changes what is actually loaded.
      #
      # Defaults to the Qwen build the PEFT pipeline produced, because that is
      # what this host serves. Note that mlc_llm does *not* validate the `model`
      # field of an incoming request against it — one model is loaded, every
      # request is answered from it, and the requested id is echoed back
      # unchanged. So pointing this at the wrong build does not fail: it answers
      # from one model while every stored row and every chart credits another.
      - ${MLC_MODEL:-/models/qwen3-4b-flutter-q4f16_1-MLC}
      - --device
      - cuda
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      # `local` keeps the KV cache small. The card has 6 GB and Windows is
      # already drawing the desktop on it, so the server mode's larger cache
      # would be the first thing to fail.
      - --mode
      - local
      # The engine does not serve the context window the model was compiled with.
      # It sizes a KV cache from what the card has left after the weights, then
      # divides that by how many sequences it is willing to batch, and enforces
      # the quotient as a hard per-request *input* limit — a longer prompt is
      # rejected with a 400 before a token is generated.
      #
      # Left to itself with the 4B build, that quotient came out at 1366 tokens
      # against a model compiled for 8192, which is under what the decision
      # persona's prompt costs: the feature could not answer at all, and the only
      # symptom was the 400 the backend used to summarise as "returned 400".
      #
      # max_num_sequence=1 gives the whole cache to one request instead of a
      # quarter of it. That is the right trade here and not a compromise: this is
      # a single-operator stack, and concurrency in this design comes from
      # scaling mlc replicas (see the README), not from batching inside one.
      #
      # Verify rather than assume, after any change to the model or the card's
      # other tenants — the engine prints what it granted:
      #   docker compose logs mlc | grep -i max_single_sequence_length
      # and LLM_MAX_PROMPT_TOKENS on the backend must not exceed that number.
      - --overrides
      - ${MLC_OVERRIDES:-max_num_sequence=1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # The hot-swap runtime, alongside mlc rather than instead of it.
  #
  # Both engines are here on purpose, because they are good at opposite things:
  #
  #   mlc       compiles the model ahead of time. That is what makes it fast,
  #             and it is exactly why it has no runtime LoRA slot — the kernels
  #             are generated before the adapter exists. Serving a tuned model
  #             means merging the adapter and recompiling.
  #
  #   llamacpp  keeps adapters as separate tensors and adds their contribution
  #             during inference, so the active adapter is a number that can be
  #             changed on a running process. Slower per token; swappable.
  #
  # So: mlc serves the production path, llamacpp serves the path where an
  # operator is comparing adapters and needs the answer to change now. Deleting
  # either one loses a requirement.
  #
  # Both reserve the same card. A 2B Q4 is ~1.7 GB here and ~1.5 GB in mlc, and
  # with the KV caches the pair fits in 6 GB — but only just, and only because
  # both are kept small. Scaling mlc past 2 replicas while this is up will run
  # the card out of memory.
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    # on-failure rather than unless-stopped: the entrypoint exits non-zero with
    # instructions when the base GGUF has not been built yet, and a permanently
    # restarting container would bury that message under its own restarts.
    restart: on-failure:3
    expose:
      - "8000"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      LLAMA_MODEL: /models/gguf/base.gguf
      LLAMA_ADAPTER_DIR: /models/gguf/adapters
      LLAMA_ALIAS: ${LLAMA_ALIAS:-gemma-2-2b-it-gguf}
    volumes:
      - ./llamacpp/entrypoint.sh:/entrypoint.sh:ro
      # Same bind mount as mlc, same reasoning: the PEFT pipeline writes here
      # from outside Docker and the server has no business writing back.
      - ${MODELS_DIR:-./models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - mlc
      - llamacpp
    environment:
      # The shared secret the Go backend must send as X-API-Key.
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY must be set — see .env.example}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    # Published on localhost only, so you can curl it from Windows while
    # developing without exposing it to the LAN.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      # `edge` is how the /prom route resolves `prometheus`, which runs in the
      # mf-observability project. Without it Caddy starts fine and that one
      # route 502s — the rest of the gateway is unaffected either way.
      - default
      - edge

  # Opt-in: `docker compose --profile tunnel up -d`.
  #
  # The tunnel is only needed once something outside this machine has to reach
  # the model — that is, once the Render backend calls it. Local development and
  # measurement work entirely without it, so requiring a token to start the
  # stack would block the work that comes first.
  #
  # Named tunnel: stable hostname, but it requires a domain already on
  # Cloudflare, because a public hostname has to live in a zone you control.
  # Joined to `edge` as well so a second public hostname can point at Grafana,
  # which lives in the mf-observability project and is otherwise on a network
  # this container cannot see. Nothing is exposed by joining a network — the
  # tunnel only serves the hostnames configured in the Cloudflare dashboard,
  # and the Grafana one is expected to sit behind an Access policy. See
  # mf-observability/README.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    depends_on:
      - gateway
    networks:
      - default
      - edge
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set — see README}

  # Opt-in: `docker compose --profile quicktunnel up -d`.
  #
  # The no-account, no-domain alternative. Cloudflare hands out a random
  # *.trycloudflare.com hostname printed in this container's logs.
  #
  # The hostname changes on every restart, so LLM_BASE_URL on the backend has to
  # be updated each time — fine while developing, wrong for anything left
  # running. Use the named tunnel above once a domain is available.
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    profiles: [quicktunnel]
    restart: unless-stopped
    depends_on:
      - gateway
    command: tunnel --no-autoupdate --url http://gateway:8080

volumes:
  model-cache:

networks:
  # The two compose projects on this machine each get their own default network
  # and cannot see each other, which is why the tunnel could not reach Grafana.
  # `edge` is the one deliberate seam between them, declared external so neither
  # project owns it and `docker compose down` in either one leaves it standing:
  #
  #   docker network create mf-edge
  #
  # cloudflared and the gateway join it: the first so a public hostname can
  # point at Grafana, the second so /prom can reach Prometheus. mlc and
  # llamacpp stay on the default network — they have nothing to say to the
  # other project, and the seam is worth keeping as narrow as its callers.
  edge:
    external: true
    name: mf-edge
